<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NLUJA Timetable</title>
  <meta name="description" content="NLUJA Assam odd-semester timetable — offline, installable, with personal attendance tracking." />
  <meta name="theme-color" content="#0f5c56" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/3d/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NLUJA TT" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#view-today">Skip to schedule</a>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="icons/3d/logo.png" alt="" />
      <div>
        <h1>NLUJA Timetable</h1>
        <p class="muted" id="todayLabel"></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="chip hidden" id="installBtn">Install app</button>
      <button class="chip" id="sectionBtn" aria-label="Change semester">—</button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch to dark theme">
        <img src="icons/3d/moon.png" alt="" width="28" height="28" />
      </button>
    </div>
  </header>

  <main>
    <section class="view" id="view-today"></section>
    <section class="view hidden" id="view-week"></section>
    <section class="view hidden" id="view-att"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="today">
      <img src="icons/3d/today.png" alt="" width="30" height="30" />
      Today
    </button>
    <button class="tab" data-view="week">
      <img src="icons/3d/week.png" alt="" width="30" height="30" />
      Week
    </button>
    <button class="tab" data-view="att">
      <img src="icons/3d/attendance.png" alt="" width="30" height="30" />
      Attendance
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
