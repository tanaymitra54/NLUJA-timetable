<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NLUJA Timetable</title>
  <meta name="description" content="NLUJA Assam odd-semester timetable — offline, installable, with personal attendance tracking." />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0d" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NLUJA TT" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">TT</span>
      <div>
        <h1>NLUJA Timetable</h1>
        <p class="muted" id="todayLabel"></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="chip hidden" id="installBtn">Install app</button>
      <button class="chip" id="sectionBtn" aria-label="Change semester">—</button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main>
    <section class="view" id="view-today"></section>
    <section class="view hidden" id="view-week"></section>
    <section class="view hidden" id="view-att"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      Today
    </button>
    <button class="tab" data-view="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      Week
    </button>
    <button class="tab" data-view="att">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
      Attendance
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
